syntax = "proto3";
package msc_management.v1;

import "bsc/v1/service.proto";
import "events/v1/msc.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// Active MSC call identifiers.
message CallList {
  // MSC call/session IDs currently tracked by call control.
  repeated string call_ids = 1;
}

// Submits a mobile-terminated SMS. Exactly one of `destination_number` or
// `destination_imsi` must be set:
//   * `destination_number` resolves the target via HLR and addresses by phone
//     number (subscriber-only path).
//   * `destination_imsi` sends to the given IMSI directly without an HLR
//     lookup; used for non-subscriber mobiles seen on the air.
message SendSmsRequest {
  string originating_number = 1;
  string text = 2;
  optional uint64 timeout_ms = 3;
  oneof destination {
    string destination_number = 4;
    string destination_imsi = 5;
  }
  // C.S0015-B teleservice ID. Defaults to 0x1002 (WMT) when absent.
  // 0x1004 (WAP) selects WAP Push delivery used by MMS M-Notification.ind.
  optional uint32 teleservice_id = 6;
  // Opaque User Data bytes for non-text teleservices (binary WAP Push PDU
  // already framed per WAP-259 §6.5). When set, `text` is ignored and the
  // BSC emits these as MSG_ENCODING=0x00 octet user data.
  optional bytes raw_user_data = 7;
}

message SendSmsResponse {
  bool accepted = 1;
  string message = 2;
}

// MSC management API for mobile-terminated voice, SMS, and call state.
service MscManagementService {
  // Initiates a mobile-terminated voice call through the BSC and voice gateway.
  rpc InitiateCall(bsc.v1.InitiateCallRequest) returns (bsc.v1.InitiateCallResponse);
  // Submits an SMS for mobile-terminated delivery.
  rpc SendSms(SendSmsRequest) returns (SendSmsResponse);
  // Lists active MSC call IDs.
  rpc ListCalls(google.protobuf.Empty) returns (CallList);
  // Streams live OTASP events for real-time dashboards. Persisted
  // session history is served separately by the HLR service.
  rpc StreamOtaspEvents(google.protobuf.Empty) returns (stream events.v1.MscNetworkEvent);
}
