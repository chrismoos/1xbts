syntax = "proto3";
package voice_gateway.v1;

// Voice gateway service connecting MSC call control to SIP/RTP media handling.
service VoiceGateway {
  // Bidirectional control stream for call setup, answer, failure, and release events.
  rpc Control(stream MscToGatewayEvent) returns (stream GatewayToMscEvent);
  // Bidirectional media stream carrying air-interface voice frames and gateway frames.
  rpc Media(stream AirVoiceFrame) returns (stream GatewayVoiceFrame);
}

// Reason a voice call or media session was released.
enum ReleaseReason {
  RELEASE_REASON_UNSPECIFIED = 0;
  RELEASE_REASON_MOBILE_RELEASED = 1;
  RELEASE_REASON_SIP_RELEASED = 2;
  RELEASE_REASON_SIP_FAILURE = 3;
  RELEASE_REASON_GATEWAY_TIMEOUT = 4;
  RELEASE_REASON_BSC_TEARDOWN = 5;
  RELEASE_REASON_MEDIA_ERROR = 6;
  RELEASE_REASON_MSC_TEARDOWN = 7;
  RELEASE_REASON_SETUP_FAILED = 8;
}

// CDMA voice frame rate carried by gateway-to-MSC media frames.
enum VoiceFrameRate {
  VOICE_FRAME_RATE_UNSPECIFIED = 0;
  VOICE_FRAME_RATE_FULL = 1;
  VOICE_FRAME_RATE_HALF = 2;
  VOICE_FRAME_RATE_QUARTER = 3;
  VOICE_FRAME_RATE_EIGHTH = 4;
}

// Control event sent from MSC call control to the voice gateway.
message MscToGatewayEvent {
  // Optional idempotency/debug identifier generated by the MSC.
  string event_id = 1;

  oneof event {
    StartOutboundCall start_outbound_call = 10;
    ReleaseCall release_call = 11;
  }
}

// Requests that the gateway place an outbound SIP call.
message StartOutboundCall {
  // MSC call/session identifier.
  string session_id = 1;
  // Destination digits or SIP-routable called party.
  string called_number = 2;
  // Caller ID digits presented to the called party.
  string caller_number = 3;
  // CDMA voice service option for the mobile leg. Supported values are
  // SO3 EVRC-A, SO68 EVRC-B, and SO70 EVRC-WB.
  uint32 service_option = 4;
}

// Requests release of an active gateway call.
message ReleaseCall {
  // MSC call/session identifier.
  string session_id = 1;
  // Release reason chosen by MSC call control.
  ReleaseReason reason = 2;
}

// Control event sent from the voice gateway back to MSC call control.
message GatewayToMscEvent {
  // Optional idempotency/debug identifier generated by the gateway.
  string event_id = 1;

  oneof event {
    GatewayRinging ringing = 10;
    GatewayAnswered answered = 11;
    GatewayFailed failed = 12;
    GatewayReleased released = 13;
  }
}

// SIP 180/183 provisional. `codec` is set when the provisional carried SDP.
message GatewayRinging {
  string session_id = 1;
  uint32 sip_status = 2;
  string codec = 3;
}

// SIP call answered notification.
message GatewayAnswered {
  // MSC call/session identifier.
  string session_id = 1;
  // Normally 200. Zero means unavailable.
  uint32 sip_status = 2;
  string codec = 3;
}

// Gateway-side call setup or media failure.
message GatewayFailed {
  // MSC call/session identifier.
  string session_id = 1;
  // SIP final response code, or zero for local/gateway failures.
  uint32 sip_status = 2;
  string reason = 3;
  ReleaseReason release_reason = 4;
}

// Gateway-side release notification for an established call.
message GatewayReleased {
  // MSC call/session identifier.
  string session_id = 1;
  // Gateway release reason.
  ReleaseReason reason = 2;
}

// Voice frame received from the mobile over the air interface.
message AirVoiceFrame {
  // MSC call/session identifier.
  string session_id = 1;
  // EVRC-family primary traffic bits from the MS. One byte per bit, value 0 or 1.
  // No full-rate MuxPDU MM header bit is included.
  bytes bits = 2;
  uint32 num_bits = 3;
  uint32 rate_bps = 4;
  uint64 sequence = 5;
  uint32 service_option = 6;
}

// Voice frame produced by the gateway for transmission to the mobile.
message GatewayVoiceFrame {
  // MSC call/session identifier.
  string session_id = 1;
  // EVRC-family primary traffic bits to send to the MS. One byte per bit, value 0 or 1.
  // The BSC adds any required MuxPDU header before queueing the traffic frame.
  bytes bits = 2;
  uint32 num_bits = 3;
  VoiceFrameRate rate = 4;
  uint64 sequence = 5;
  uint32 service_option = 6;
}
