syntax = "proto3";
package events.v1;

import "events/v1/cell.proto";
import "events/v1/pdsn.proto";

// A1 signaling (A.S0014 / A.S0001), carried over Fx2 by X.S0059-200 §8.1.1.2.

// Which way the message crossed the A1 reference point.
enum A1Direction {
  A1_DIRECTION_UNSPECIFIED = 0;
  // Access network toward the MSC (mobile-originated signaling).
  A1_DIRECTION_UPLINK = 1;
  // MSC toward the access network (mobile-terminated signaling).
  A1_DIRECTION_DOWNLINK = 2;
}

// Whether the encapsulated message is DTAP or BSMAP. Mandatory to disambiguate
// the code points shared by both (0x53, 0x54).
enum A1MessageDiscriminator {
  A1_MESSAGE_DISCRIMINATOR_UNSPECIFIED = 0;
  A1_MESSAGE_DISCRIMINATOR_DTAP = 1;
  A1_MESSAGE_DISCRIMINATOR_BSMAP = 2;
}

// A1 message types this stack models. `A1_MESSAGE_TYPE_OTHER` means the raw
// `message_type_value` was decoded but has no typed model here — the SDU and
// the information elements are still complete.
enum A1MessageType {
  A1_MESSAGE_TYPE_UNSPECIFIED = 0;
  A1_MESSAGE_TYPE_LOCATION_UPDATING_REQUEST = 1;
  A1_MESSAGE_TYPE_LOCATION_UPDATING_ACCEPT = 2;
  A1_MESSAGE_TYPE_CM_SERVICE_REQUEST = 3;
  A1_MESSAGE_TYPE_PAGING_REQUEST = 4;
  A1_MESSAGE_TYPE_PAGING_RESPONSE = 5;
  A1_MESSAGE_TYPE_ASSIGNMENT_REQUEST = 6;
  A1_MESSAGE_TYPE_ASSIGNMENT_COMPLETE = 7;
  A1_MESSAGE_TYPE_ADDS_PAGE = 8;
  A1_MESSAGE_TYPE_ADDS_PAGE_ACK = 9;
  A1_MESSAGE_TYPE_ADDS_TRANSFER = 10;
  A1_MESSAGE_TYPE_ADDS_TRANSFER_ACK = 11;
  A1_MESSAGE_TYPE_ADDS_DELIVER = 12;
  A1_MESSAGE_TYPE_ADDS_DELIVER_ACK = 13;
  A1_MESSAGE_TYPE_OTHER = 14;
  // Messages the femtocell exchanges with the MSC but never carries over Fx2:
  // the FAP expresses them as SIP methods and response codes, so they are
  // observed at the A1 reference point rather than in a FemtoInterfaceMsg body.
  A1_MESSAGE_TYPE_COMPLETE_LAYER3_INFORMATION = 15;
  A1_MESSAGE_TYPE_CLEAR_REQUEST = 16;
  A1_MESSAGE_TYPE_CLEAR_COMMAND = 17;
  A1_MESSAGE_TYPE_CLEAR_COMPLETE = 18;
  A1_MESSAGE_TYPE_PROGRESS = 19;
  A1_MESSAGE_TYPE_CONNECT = 20;
  A1_MESSAGE_TYPE_ALERT_WITH_INFORMATION = 21;
  A1_MESSAGE_TYPE_ASSIGNMENT_FAILURE = 22;
}

// Application Data Delivery Service burst type, from the ADDS User Part IE
// (A.S0001 §6.2.2.67). Identifies which application owns the opaque payload.
enum AddsBurstType {
  ADDS_BURST_TYPE_UNSPECIFIED = 0;
  // C.S0015 SMS transport-layer message.
  ADDS_BURST_TYPE_SMS = 1;
  // Over-the-air service provisioning (OTASP).
  ADDS_BURST_TYPE_OTA = 2;
  // Position location determination (PDS).
  ADDS_BURST_TYPE_PLD = 3;
  ADDS_BURST_TYPE_OTHER = 4;
}

// Wire bytes retain unmodeled information elements.
message A1InformationElement {
  // Information Element Identifier.
  uint32 iei = 1;
  // Human-readable IE name, empty when unmodelled.
  string name = 2;
  // The IE's exact on-the-wire bytes, beginning with the IEI itself for a
  // Type 3/4 IE.
  bytes content = 3;

  // Unmodeled elements retain their wire content without a decoded value.
  oneof decoded {
    A1MobileIdentityIe mobile_identity = 4;
    A1ServiceOptionIe service_option = 5;
    A1RegistrationTypeIe registration_type = 6;
    A1CmServiceTypeIe cm_service_type = 7;
    A1SlotCycleIndexIe slot_cycle_index = 8;
    A1TagIe tag = 9;
    A1ChannelTypeIe channel_type = 10;
    A1ChannelNumberIe channel_number = 11;
    A1CalledPartyIe called_party = 12;
    A1AuthResponseIe auth_response = 13;
    A1AuthConfirmationIe auth_confirmation = 14;
    A1AuthCountIe auth_count = 15;
    A1AuthChallengeIe auth_challenge = 16;
  }
}

// Which identity form a Mobile Identity IE carried.
enum A1MobileIdentityForm {
  A1_MOBILE_IDENTITY_FORM_UNSPECIFIED = 0;
  A1_MOBILE_IDENTITY_FORM_IMSI = 1;
  A1_MOBILE_IDENTITY_FORM_ESN = 2;
  A1_MOBILE_IDENTITY_FORM_MEID = 3;
}

// Mobile Identity (IEI 0x0D). One IE carries exactly one form, and a message
// commonly repeats the IE once per form it wants to convey.
message A1MobileIdentityIe {
  A1MobileIdentityForm form = 1;
  // Set for the IMSI form. Digits as sent — IMSI_S on FAPs that abbreviate.
  string imsi = 2;
  // Set for the ESN form.
  uint32 esn = 3;
  // Set for the MEID form, lowercase hex.
  string meid = 4;
}

// Service Option (IEI 0x03). Enum values retain the wire service-option numbers.
message A1ServiceOptionIe {
  ServiceOption service_option = 1;
}

// Why the mobile registered (C.S0005-E REG_TYPE). Variant numbers are the wire
// values, and 0 is a real one, so there is no separate unspecified variant.
enum A1RegistrationType {
  A1_REGISTRATION_TYPE_TIMER_BASED = 0;
  A1_REGISTRATION_TYPE_POWER_UP = 1;
  A1_REGISTRATION_TYPE_ZONE_BASED = 2;
  A1_REGISTRATION_TYPE_POWER_DOWN = 3;
  A1_REGISTRATION_TYPE_PARAMETER_CHANGE = 4;
  A1_REGISTRATION_TYPE_DISTANCE_BASED = 6;
}

// Registration Type (IEI 0x1F).
message A1RegistrationTypeIe {
  A1RegistrationType type = 1;
}

// What the mobile is requesting service for. Variant numbers are the wire
// values. 0 is unused on the wire and means the value was absent.
enum A1CmServiceType {
  A1_CM_SERVICE_TYPE_UNSPECIFIED = 0;
  A1_CM_SERVICE_TYPE_MOBILE_ORIGINATING_CALL = 1;
  A1_CM_SERVICE_TYPE_EMERGENCY_CALL = 2;
  A1_CM_SERVICE_TYPE_SHORT_MESSAGE_TRANSFER = 4;
  A1_CM_SERVICE_TYPE_SUPPLEMENTARY_SERVICE_ACTIVATION = 8;
}

// CM Service Type (IEI 0x90). A Type 1 IE: the IEI and the value share one
// octet, so `content` here is a single byte.
message A1CmServiceTypeIe {
  A1CmServiceType type = 1;
}

// Slot Cycle Index (IEI 0x35) — the mobile's paging slot cycle.
message A1SlotCycleIndexIe {
  uint32 value = 1;
}

// Tag (IEI 0x33) — correlates a request with its response.
message A1TagIe {
  uint32 value = 1;
}

// Channel Type (IEI 0x0B).
message A1ChannelTypeIe {
  uint32 speech_or_data_indicator = 1;
  uint32 channel_rate_and_type = 2;
  uint32 coding = 3;
}

// Channel Number (IEI 0x23).
message A1ChannelNumberIe {
  uint32 value = 1;
}

// Type of a dialed number (ANSI T1.607, carried in C.S0005-E §2.7.1.3.2.4).
// Variant numbers are the wire values, and 0 is a real one.
enum A1NumberType {
  A1_NUMBER_TYPE_UNKNOWN = 0;
  A1_NUMBER_TYPE_INTERNATIONAL = 1;
  A1_NUMBER_TYPE_NATIONAL = 2;
  A1_NUMBER_TYPE_NETWORK_SPECIFIC = 3;
  A1_NUMBER_TYPE_SUBSCRIBER = 4;
  A1_NUMBER_TYPE_ABBREVIATED = 6;
}

// Numbering plan of a dialed number (ANSI T1.607). Wire values, 0 is real.
enum A1NumberingPlan {
  A1_NUMBERING_PLAN_UNKNOWN = 0;
  A1_NUMBERING_PLAN_ISDN = 1;
  A1_NUMBERING_PLAN_DATA = 3;
  A1_NUMBERING_PLAN_TELEX = 4;
  A1_NUMBERING_PLAN_PRIVATE = 9;
}

// Called Party BCD Number (IEI 0x5E) — the dialed digits on an origination.
message A1CalledPartyIe {
  A1NumberType number_type = 1;
  A1NumberingPlan numbering_plan = 2;
  // BCD digits decoded to their character form.
  string digits = 3;
}

// Authentication Response Parameter (IEI 0x42) — AUTHR.
//
// This stack holds the parameter as opaque bytes rather than modelling its bit
// layout, so what is offered here is the value with its IE framing stripped,
// not a decoded AUTHR. Inventing a field split would risk displaying a
// confidently wrong number.
message A1AuthResponseIe {
  bytes value = 1;
  string value_hex = 2;
}

// Authentication Confirmation Parameter (IEI 0x28) — RANDC.
message A1AuthConfirmationIe {
  uint32 randc = 1;
}

// Authentication Parameter COUNT (IEI 0x40).
message A1AuthCountIe {
  uint32 count = 1;
}

// Authentication Challenge Parameter (IEI 0x41) — RAND.
//
// Held as opaque bytes for the same reason as A1AuthResponseIe: the value with
// its IE framing stripped, not a decoded field split.
message A1AuthChallengeIe {
  bytes value = 1;
  string value_hex = 2;
}

// Mobile identity carried by the message, in whichever forms were present.
message A1MobileIdentity {
  string imsi = 1;
  uint32 esn = 2;
  string meid = 3;
}

// ADDS payload metadata, set only on the ADDS message types. The payload
// itself is the air-interface application PDU carried verbatim — for SMS these
// are the same octets the handset transmitted in its Data Burst Message.
message A1AddsPayload {
  AddsBurstType burst_type = 1;
  // Raw burst-type code point as it appeared on the wire.
  uint32 burst_type_value = 2;
  uint32 payload_length_bytes = 3;
}

// One A1 signaling message, complete.
message A1SignalingEvent {
  optional string voice_privacy = 20;
  A1Direction direction = 1;
  A1MessageDiscriminator discriminator = 2;
  A1MessageType message_type = 3;
  // Raw A.S0014 Message Type Value, always set.
  uint32 message_type_value = 4;
  // Message name for display, e.g. "Location Updating Request".
  string message_type_name = 5;

  // Reassembled Layer 3 SDU. Encryption parameter values are replaced with zeros.
  bytes sdu = 6;
  // Same bytes as uppercase hex, for display and copy-paste.
  string sdu_hex = 7;
  // Every information element, in wire order.
  repeated A1InformationElement information_elements = 8;

  // Short human-readable description of what the message says.
  string summary = 9;
  // Cell that served the transaction, when known.
  CellId cell = 10;
  A1MobileIdentity mobile_identity = 11;
  A1AddsPayload adds = 12;

  // Microseconds since the Unix epoch, stamped at the observation point.
  uint64 timestamp_us = 13 [jstype = JS_STRING];
  // Stable id for de-duplication in the UI.
  string event_id = 14;

  // Transport correlation for the leg this message arrived on.
  // SIP Call-ID when the A1 content rode an Fx2 SIP body.
  string sip_call_id = 15;
  // MIME content-type of the body that carried it.
  string content_type = 16;
  // Peer address the message was observed from or sent to.
  string peer = 17;
  // Stable identity of the A1 peer this message was exchanged with: the FEID
  // for a femtocell, the base-station id for a BSC. Empty when unknown.
  string peer_id = 19;
  // Project-local A1 call correlation id, when one was assigned.
  uint64 a1_call_id = 18 [jstype = JS_STRING];
}
