services:
  postgres:
    image: postgres:17
    container_name: 1xbts-postgres
    ports:
      - "45432:5432"
    environment:
      POSTGRES_DB: 1xbts
      POSTGRES_USER: 1xbts
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1xbts}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U 1xbts -d 1xbts"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  1xbts-web:
    image: node:25-bookworm
    container_name: 1xbts-web
    network_mode: host
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    environment:
      MANAGEMENT_GRPC_ADDRESS: ${MANAGEMENT_GRPC_ADDRESS:-127.0.0.1:17016}
      MSC_GRPC_ADDRESS: ${MSC_GRPC_ADDRESS:-127.0.0.1:17017}
      AN_GRPC_ADDRESS: ${AN_GRPC_ADDRESS:-127.0.0.1:17030}
      EVENTS_GRPC_ADDRESS: ${EVENTS_GRPC_ADDRESS:-127.0.0.1:17023}
      WATCHPACK_POLLING: "true"
    volumes:
      - ./1xbts-web:/app
      - 1xbts-web-node-modules:/app/node_modules
    restart: unless-stopped

  speedtest:
    build:
      context: ./apps/speedtest
    container_name: 1xbts-speedtest
    environment:
      PORT: "5656"
    restart: unless-stopped

  fou-nat:
    build:
      context: .
      dockerfile: docker/fou-nat/Dockerfile
    container_name: 1xbts-fou-nat
    depends_on:
      - speedtest
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    ports:
      - "17012:17012/tcp"
      - "${SPEEDTEST_PORT:-5656}:80/tcp"
    environment:
      FOU_LISTEN_PORT: "17010"
      FOU_REMOTE_PORT: "17011"
      FOU_TCP_PORT: "17012"
      MOBILE_CIDR: "10.55.0.0/24"
      TUNNEL_ADDR: "10.55.0.1/24"
      FOU_LOCAL_IP: "127.0.0.1"
      SPEEDTEST_UPSTREAM: "http://speedtest:5656"
      LOCAL_DNS_ZONE: "local.1xbts.org"
      UNBOUND_FORWARD_ADDRS: ${UNBOUND_FORWARD_ADDRS:-8.8.8.8}
      # Used by the edge-resolver sidecar to look up subscriber MSISDN
      # via the BSC's PdsnManagementService facade for the X-1xBTS-MSISDN
      # header it injects into MMSC traffic.
      MGMT_GRPC_ADDR: "${MGMT_GRPC_ADDR:-host.docker.internal:17016}"
      # Openwave UP.Link (HDTP) gateway. Comma-separated IP:port endpoints the
      # handset dials for its provisioned proxy are DNAT'd to the local gateway,
      # which browses the web and returns HDML. Set HDTP_ENABLE=0 to disable.
      HDTP_ENABLE: "${HDTP_ENABLE:-1}"
      HDTP_HIJACK_ENDPOINTS: "${HDTP_HIJACK_ENDPOINTS:-153.114.115.100:1905,153.114.116.100:1905}"
      # SessionReply shape, tunable on-air without rebuilding while the exact
      # UP.Browser 3.1 form is pinned down. Layout: sugp | hdtp11 | both.
      # Nonce (which SessionRequest bytes are the C-nonce): last | prev | both.
      HDTP_REPLY_LAYOUT: "${HDTP_REPLY_LAYOUT:-hdtp11}"
      HDTP_REPLY_NONCE: "${HDTP_REPLY_NONCE:-prev}"
      # Content-Type for HDML replies: text/x-hdml | text/hdml | application/x-hdmlc.
      HDTP_CONTENT_TYPE: "${HDTP_CONTENT_TYPE:-text/x-hdml}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Optional MMS profile: enable with `docker compose --profile mms up`.
  # Runs Mbuni MMSC + the in-tree smsc-bridge in one container. Reachable
  # from mobiles at http://mmsc.local.1xbts.org/ via the captive DNS in
  # fou-nat (which forwards local.1xbts.org to docker's embedded DNS).
  mbuni:
    build:
      context: .
      dockerfile: docker/mbuni/Dockerfile
    container_name: 1xbts-mbuni
    profiles: ["mms"]
    networks:
      default:
        aliases:
          - mmsc.local.1xbts.org
    environment:
      MMSC_HOSTNAME: "mmsc.local.1xbts.org"
      MMSC_PORT: "80"
      BRIDGE_BIND_ADDR: "127.0.0.1:8081"
      MSC_GRPC_ADDR: "${MSC_GRPC_ADDR:-host.docker.internal:17017}"
    depends_on:
      - fou-nat
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - mbuni-store:/var/spool/mbuni
    restart: unless-stopped

volumes:
  postgres-data:
  1xbts-web-node-modules:
  mbuni-store:
