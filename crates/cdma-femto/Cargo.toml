[package]
name = "cdma-femto"
version = "0.1.0"
edition = "2024"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Standards-facing CDMA femtocell (FAP) integration service: SeGW, ACS/FMS, AAA, IMS/SIP, FCS, and packet ingress for a 3GPP2 femtocell access point."

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tonic = "0.13"
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
chrono = "0.4"
tzf-rs = "2.1.3"
md-5 = "0.10"
env_logger = "0.11"
axum = "0.8"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["service", "tokio"] }
tower = "0.5"
cdma-common = { path = "../cdma-common" }
cdma-a11 = { path = "../cdma-a11" }
cdma-events = { path = "../cdma-events" }
cdma-ios = { path = "../cdma-ios" }
cdma-cave = { path = "../cdma-cave" }
cdma-cwmp = { path = "../cdma-cwmp" }
cdma-sip = { path = "../cdma-sip" }

[dev-dependencies]
async-trait = "0.1"

[build-dependencies]
tonic-build = "0.13"

[[bin]]
name = "cdma-femto"
path = "src/main.rs"

[[bin]]
name = "cdma-femto-segw-config"
path = "src/bin/segw_config.rs"

[lints]
workspace = true
