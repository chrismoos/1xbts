[package]
name = "cdma-smsc"
version = "0.1.0"
edition = "2024"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "PostgreSQL-backed SMSC service and repository for 1xBTS."

[dependencies]
cdma-common = { path = "../cdma-common" }
cdma-rpc-error = { path = "../cdma-rpc-error" }
cdma-hlr = { path = "../cdma-hlr" }
cdma-interconnect = { path = "../cdma-interconnect" }
cdma-interconnect-smpp = { path = "../cdma-interconnect-smpp" }
tokio = { version = "1", features = ["full"] }
futures-core = "0.3"
tokio-stream = "0.1"
tonic = "0.13"
prost = "0.13"
prost-types = "0.13"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "migrate"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
tonic-build = "0.13"

[lib]
path = "src/lib/mod.rs"

[[bin]]
name = "cdma-smsc"
path = "src/main.rs"

[lints]
workspace = true
