[package]
name = "cdma-bts"
version = "0.1.0"
edition = "2024"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "BTS, LAC/MAC, PHY, receiver, and SDR backend implementation for 1xBTS."

[lib]
path = "src/lib/mod.rs"

[features]
default = [
    "uhd-backend",
    "lime-backend",
    "bladerf-backend",
    "soapy-backend",
    "network-backend",
]
uhd-backend = ["uhd"]
lime-backend = ["limesuite"]
bladerf-backend = ["bladerf"]
soapy-backend = ["soapysdr"]
network-backend = ["dep:socket2"]

[dependencies]
num = "0.4"
uhd = { path = "../../external/uhd", optional = true }
limesuite = { path = "../../external/limesuite", optional = true }
bladerf = { path = "../../external/bladerf", optional = true }
soapysdr = { version = "0.5", optional = true }
hound = "3"
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"
tracing = "0.1"
tracing-subscriber = {version = "0.3", features = ["env-filter"]}
biquad = "0.6"
cdma-common = { path = "../cdma-common"}
chrono = "0.4"
num-complex = "0.4"
libc = "0.2"
socket2 = { workspace = true, optional = true }
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
clap = { version = "4", features = ["derive"] }
parking_lot = "0.12"
crossbeam-channel = "0.5"
crossbeam-queue = "0.3"
cdma-abis = { path = "../cdma-abis" }
cdma-a8 = { path = "../cdma-a8" }
cdma-a9 = { path = "../cdma-a9" }
cdma-an = { path = "../cdma-an" }
cdma-events = { path = "../cdma-events" }
cdma-hlr = { path = "../cdma-hlr" }
cdma-pcf = { path = "../cdma-pcf" }
tonic = { version = "0.13", features = ["tls-ring"] }
prost = "0.13"
async-stream = "0.3"
tokio-stream = { version = "0.1", features = ["net"] }

[build-dependencies]
tonic-build = "0.13"

[dev-dependencies]
cdma-a10 = { path = "../cdma-a10" }
cdma-a11 = { path = "../cdma-a11" }
cdma-pdsn = { path = "../cdma-pdsn" }
cdma-voice = { path = "../cdma-voice" }

[lints]
workspace = true
