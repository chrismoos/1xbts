[package]
name = "cdma-a21"
version = "0.1.0"
edition = "2024"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "A21 AN-to-IWS signaling (A.S0008-C) for 1x and HRPD interworking."

[dependencies]
thiserror = "2"
tokio = { version = "1", features = ["net"] }

[dev-dependencies]
tokio = { version = "1", features = ["net", "io-util", "sync", "macros", "rt", "rt-multi-thread", "time"] }

[lib]
path = "src/lib.rs"

[lints]
workspace = true
