[package]
name = "cdma-a9"
version = "0.1.0"
edition = "2024"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "A9 packet-data signaling support for the 1xBTS packet core."

[dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["net", "io-util", "sync", "rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["net", "io-util", "sync", "rt", "macros", "time"] }

[lib]
path = "src/lib.rs"

[lints]
workspace = true
