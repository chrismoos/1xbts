[package]
name = "cdma-pdsn"
version = "0.1.0"
edition = "2024"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "PDSN session and packet-data gateway support for 1xBTS."

[dependencies]
cdma-a10 = { path = "../cdma-a10" }
cdma-a11 = { path = "../cdma-a11" }
cdma-packet = { path = "../cdma-packet" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync"] }
tonic = "0.13"

[lib]
path = "src/lib.rs"

[lints]
workspace = true
