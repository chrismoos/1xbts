[package]
name = "cdma-pdsn"
version = "0.1.0"
edition = "2024"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "PDSN session and packet-data gateway support for 1xBTS."

[dependencies]
cdma-a10 = { path = "../cdma-a10" }
cdma-a8 = { path = "../cdma-a8" }
cdma-common = { path = "../cdma-common" }
cdma-a11 = { path = "../cdma-a11" }
cdma-events = { path = "../cdma-events" }
cdma-packet = { path = "../cdma-packet" }
base64 = "0.22"
prost-types = "0.13"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync"] }
tonic = "0.13"

[dev-dependencies]
tokio-stream = { version = "0.1", features = ["net"] }

[lib]
path = "src/lib.rs"

[lints]
workspace = true
