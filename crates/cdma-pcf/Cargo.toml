[package]
name = "cdma-pcf"
version = "0.1.0"
edition = "2024"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "PCF session and packet-data control support for 1xBTS."

[dependencies]
cdma-a8 = { path = "../cdma-a8" }
cdma-a9 = { path = "../cdma-a9" }
cdma-a10 = { path = "../cdma-a10" }
cdma-a11 = { path = "../cdma-a11" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
path = "src/lib.rs"

[lints]
workspace = true
