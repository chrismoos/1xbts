[package]
name = "cdma-bsc"
version = "0.1.0"
edition = "2024"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "BSC, mobility, paging, SMS, traffic, packet-data, and management services for 1xBTS."

[features]
default = ["uhd-backend", "lime-backend", "bladerf-backend"]
uhd-backend = ["cdma-bts/uhd-backend"]
lime-backend = ["cdma-bts/lime-backend"]
bladerf-backend = ["cdma-bts/bladerf-backend"]
soapy-backend = ["cdma-bts/soapy-backend"]
test-utils = []

[dependencies]
cdma-abis = { path = "../cdma-abis" }
cdma-a8 = { path = "../cdma-a8" }
cdma-a10 = { path = "../cdma-a10" }
cdma-a11 = { path = "../cdma-a11" }
cdma-common = { path = "../cdma-common"}
cdma-bts = { path = "../cdma-bts", default-features = false }
cdma-ios = { path = "../cdma-ios" }
log = "0.4"
chrono = "0.4"
tokio = { version = "1", features = ["full", "tracing"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.13", features = ["tls-ring"] }
prost = "0.13"
prost-types = "0.13"
async-stream = "0.3"
tracing = "0.1"
hound = "3.5"
itertools = "0.14"
num = "0.4"
num-complex = "0.4"
sdr = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cdma-hlr = { path = "../cdma-hlr" }
cdma-msc = { path = "../cdma-msc" }
cdma-packet = { path = "../cdma-packet" }
cdma-pcf = { path = "../cdma-pcf" }
cdma-pdsn = { path = "../cdma-pdsn" }
cdma-smsc = { path = "../cdma-smsc" }
cdma-voice = { path = "../cdma-voice" }
uuid = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres"] }
parking_lot = "0.12"
async-trait = "0.1"

[dev-dependencies]
cdma-bsc = { path = ".", features = ["test-utils"] }
env_logger = "0.11"

[build-dependencies]
tonic-build = "0.13"

[lib]
path = "src/lib/mod.rs"

[lints]
workspace = true
