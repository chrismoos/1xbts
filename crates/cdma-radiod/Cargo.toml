[package]
name = "cdma-radiod"
version = "0.1.0"
edition = "2024"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Standalone radio server: serves a local SDR to a remote BTS over a gRPC control plane and UDP sample data plane."

[features]
default = [
    "uhd-backend",
    "lime-backend",
    "bladerf-backend",
    "soapy-backend",
]
uhd-backend = ["cdma-bts/uhd-backend"]
lime-backend = ["cdma-bts/lime-backend"]
bladerf-backend = ["cdma-bts/bladerf-backend"]
soapy-backend = ["cdma-bts/soapy-backend"]

[dependencies]
cdma-bts = { path = "../cdma-bts", default-features = false, features = ["network-backend"] }
cdma-common = { path = "../cdma-common" }
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
env_logger = "0.11"
socket2.workspace = true
log = "0.4"
num-complex = "0.4"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.13"

[dev-dependencies]
cdma-ms = { path = "../cdma-ms", default-features = false }

[lints]
workspace = true
