[package]
name = "cdma-sctp"
version = "0.1.0"
edition = "2024"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Async SCTP associations over Linux kernel SCTP or the vendored usrsctp stack."
build = "build.rs"

[features]
default = ["usrsctp"]
# Builds the usrsctp backend on Linux, where `auto` falls back to it when kernel
# SCTP is unavailable. Other targets always build it.
usrsctp = ["dep:usrsctp-sys"]

[dependencies]
libc = "0.2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
socket2 = { workspace = true }
thiserror = "2"
tokio = { version = "1", features = ["net", "sync", "rt", "time"] }
usrsctp-sys = { path = "../../external/usrsctp-sys", optional = true }

[target.'cfg(not(target_os = "linux"))'.dependencies]
usrsctp-sys = { path = "../../external/usrsctp-sys" }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }

[lints]
workspace = true
