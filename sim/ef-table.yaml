# CSIM applet EF table (C.S0065-B §5.2, TS 102 221 §13 for the 2Fxx files).
#
# csim sends it to the applet with INIT_META after install and before each
# write, 8 bytes per EF. sfi 0 means none. record_length is set for record
# EFs only. read and update are ALW, PIN1, PIN2, ADM or NEV. Where the spec
# leaves a size or record count to the operator, the note gives the value
# chosen. The applet derives DEACTIVATE and ACTIVATE from the FID.

